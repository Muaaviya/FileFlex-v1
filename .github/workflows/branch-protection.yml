name: Branch Protection

on:
  push:
    branches: [main]

jobs:
  block-direct-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block direct merge to main
        run: |
          echo "❌ Direct push to main branch is blocked."
          echo "Please create a pull request and get it merged manually."
          echo ""
          echo "To merge a PR to main:"
          echo "1. Ensure your PR has all required approvals"
          echo "2. Ensure all CI checks pass"
          echo "3. Click 'Merge pull request' or 'Rebase and merge'"
          echo ""
          echo "Never push directly to main - always use pull requests."
          exit 1